user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    # Alpine Nginx 的默认 mime.types 未包含 .mjs。PDF.js 使用 ES module
    # worker；若按 application/octet-stream 返回，同时启用 nosniff，
    # Chrome/WebView 会拒绝执行并导致所有 PDF 在线预览失败。
    types {
        application/javascript  mjs;
    }
    default_type  application/octet-stream;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=ierp_login:10m rate=30r/m;

    client_max_body_size 100M;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://get.geojs.io https://api.open-meteo.com; frame-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;

        location = /health/live {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /health/ready {
            access_log off;
            proxy_pass http://backend:3000/health/ready;
            proxy_set_header Host $host;
        }

        # 带内容哈希的构建资源可以长期缓存；入口页必须重新验证，
        # 否则升级后浏览器会继续引用旧的分包文件。
        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://get.geojs.io https://api.open-meteo.com; frame-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;
        }

        # 前端静态文件
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://get.geojs.io https://api.open-meteo.com; frame-src 'self'; media-src 'self' blob:; worker-src 'self' blob:" always;
        }

        # 登录入口增加主机级限流；30人同一公网出口同时登录仍可通过突发窗口。
        location = /api/auth/login {
            limit_req zone=ierp_login burst=30 nodelay;
            limit_req_status 429;
            proxy_pass http://backend:3000/auth/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # 上传请求直接流式转发给后端，避免 Nginx 先完整写入临时文件。
        location = /api/upload {
            proxy_pass http://backend:3000/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 100M;
        }

        location ^~ /api/upload/chunks/ {
            proxy_pass http://backend:3000/upload/chunks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            client_max_body_size 5M;
        }

        # 其它后端接口代理
        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            client_max_body_size 100M;
        }
    }
}
